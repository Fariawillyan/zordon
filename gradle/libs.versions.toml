# Única fonte de versões do projeto (ADR-0002).
# Nenhum número de versão pode aparecer em um build.gradle.kts.

[versions]
java = "25"
jackson = "2.22.2"
javaWebsocket = "1.6.0"
anthropic = "2.63.0"
slf4j = "2.0.19"
logback = "1.6.3"
junit = "5.14.4"
assertj = "3.27.7"
archunit = "1.5.0"
javafx = "25.0.4"
tomlj = "1.3.0"
checkerQual = "3.55.1"
sqliteJdbc = "3.53.4.0"

[libraries]
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
# Configuração do Zordon é TOML (preços, agentes, rotas rápidas). Apache-2.0.
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
# Só em compilação: as anotações do tomlj referenciam estes tipos, e sem eles
# o javac emite avisos que escondem os avisos que importam. MIT.
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checkerQual" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
# Auditoria append-only do M3 (SPEC-014). Apache-2.0; traz o SQLite nativo.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.2" }
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
# SBOM (SECURITY.md, cadeia de suprimentos). Plugin de build: não entra no binário.
cyclonedx = { id = "org.cyclonedx.bom", version = "3.0.1" }
