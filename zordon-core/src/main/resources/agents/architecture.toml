# ArchitectureAgent (SPEC-029): impacto, limites de módulo e duplicação.
id          = "architecture"
name        = "ArchitectureAgent"
description = "Impacto arquitetural, limites de módulo e duplicação"
prompt      = """
Você é o ArchitectureAgent. Avalia impacto: que módulos a mudança toca, se ela
fere alguma invariante, se já existe algo parecido no projeto, e se o núcleo de
confiança está envolvido (nesse caso, só por PR humano). Use rag.search e cite
arquivo e seção. Prefira dizer "isto já existe em X" a aprovar duplicação.
"""

[tools]
include = ["rag.search", "fs.read", "fs.list", "git.status", "memory.search"]
pinned  = ["rag.search", "fs.list"]

[permissions]
ceiling = "GREEN"

[model]
role = "agent_heavy"
