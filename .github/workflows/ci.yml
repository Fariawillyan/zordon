# Build, testes e portões automáticos da Definition of Done.
#
# Nenhuma etapa é pulável por label, por urgência ou por quem abriu o PR
# (docs/security/supply-chain.md §3).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # O wrapper é validado contra o checksum publicado: um wrapper trocado
          # executa código arbitrário em toda build.
          validate-wrappers: true

      # Os testes de janela do desktop (SPEC-005) precisam de um display; sem
      # ele, são pulados e o portão de layout deixa de existir.
      - name: Display virtual
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Verificação completa
        run: xvfb-run -a ./gradlew verifyAll --stacktrace

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Capturas do shell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-do-shell
          path: zordon-desktop/build/ui-snapshots/
          retention-days: 7

  build-from-scratch:
    name: Build sem cache
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Mitigação declarada em ADR-0002: garantir que o build funciona do zero,
      # e não só com o cache quente de quem já compilou.
      # Com tela virtual, como o job principal: sem ela, os testes de JavaFX
      # eram pulados e este job aprovava uma superfície menor.
      - name: Display virtual
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - run: xvfb-run -a ./gradlew verifyAll --no-build-cache --no-configuration-cache
